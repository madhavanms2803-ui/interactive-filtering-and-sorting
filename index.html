<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>RecipeJS - Part 2</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>RecipeJS 🍳</h1>

  <div class="controls">
    <h3>Filter</h3>
    <button id="allBtn">All</button>
    <button id="easyBtn">Easy</button>
    <button id="mediumBtn">Medium</button>
    <button id="hardBtn">Hard</button>
    <button id="quickBtn">Quick (&lt; 30 min)</button>

    <h3>Sort</h3>
    <button id="nameSortBtn">Name (A-Z)</button>
    <button id="timeSortBtn">Time (Fastest)</button>
  </div>

  <div id="recipeList" class="recipes"></div>

  <script src="script.js"></script>
</body>
</html>
